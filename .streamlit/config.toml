[theme]
base = "light"
font = "sans serif"

[theme.light]
primaryColor = "#347B82"
backgroundColor = "#F2F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#25394A"
borderColor = "#DCE7EB"
dataframeHeaderBackgroundColor = "#EAF1F4"
chartCategoricalColors = ["#347B82", "#7FA99A", "#5B7C99", "#D49A66", "#8B79A6"]

[theme.dark]
